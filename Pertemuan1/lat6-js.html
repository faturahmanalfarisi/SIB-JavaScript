<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Pembanding</title>
</head>
<body>
    <script>
        let x = 10;
        let y = 20;

        //Operator Sama Dengan (=)
        document.write(x == y);
        document.write("<br>"); 

        //Operator sama dengan (==)
        document.write(x === y);
        document.write("<br>");

        //Operator Tidak Sama Dengan (!=)
        document.write(x != y);
        document.write("<br>");

        //Operator Lebih Besar Dari (>)
        document.write(x > y);
        document.write("<br>");

        //Operator Lebih Kecil Dari (<)
        document.write(x < y);
        document.write("<br>");

        //Operator Lebih Besar Dari Sama Dengan (>=)
        document.write(x >= y);
        document.write("<br>");

        //Operator Lebih Kecil Dari Sama Dengan (<=)
        document.write(x <= y);
        document.write("<br>");
        
    </script>
</body>
</html>
