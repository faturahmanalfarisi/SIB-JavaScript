<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variabel</title>
</head>
<body>
    <script>
        var kalimat="Saya sedang belajar JavaScript";
        alert(kalimat);
        document.write(kalimat);
        console.log(kalimat);
        
        document.write("<br>");
        
        let kalimat2="Saya suka belajar JavaScript";
        alert(kalimat2);
        document.write(kalimat2);
        console.log(kalimat2);

        document.write("<hr>");

        let kursus="NFA";
        let alamat="Jl. Lenteng Agung Raya";
        document.write("Aku kursus di "+kursus+" Alamatnya di "+alamat );
        // document.write("Saya Kurus di "+kursus);        
        // document.write(" Berlokasi di "+alamat);
        
        document.write("<hr>");

        let nama="Faturahman Alfarisi"
        let pekerjaan="Mahasiswa"
        let umur=21; //tipe data integer
        let berat=80.5; //tipe data float
        // cetak langsung
        document.write("Nama saya "+nama+" Pekerjaan Saya "+pekerjaan+" Umur Saya "+umur+" Berat Saya "+berat);

        document.write("<hr>");

        var produk="TV"
        let stok=4; // var/let = nilainya dapat diubah
        const harga=5000000; //konstanta = nilainya tidak dapat diubah/tetap
        //cetak 1
        document.write("Nama Produk : "+produk);
        document.write("<br>Stok Produk : "+stok);
        document.write("<br>Harga Produk : Rp. "+harga);

        document.write("<br>");
        
        //cetak 2
        document.write("Nama Produk : "+produk+"<br>Stok Produk : "+stok+"<br>Harga Produk : Rp. "+harga);

        document.write("<hr>");

        //Deklarasi & Inisiasi Variabel Konstanta
        let jari2= 15;
        const phi= 3.14;

        //Hitung Luas & Keliling Lingkaran
        let keliling = 2 * phi * jari2; //Rumus Keliling
        let luas = phi * jari2 * jari2; //Rumus Luas

        //Cetak
        document.write(
            "Diketahui jari-jari sebuah lingkaran: " +jari2 + " cm" +
            "<br>Keliling Lingkaran: " + keliling + "cm" +
            "<br>Luas Lingkaran: " + luas + " cm"
        );

    </script>
</body>
</html>
