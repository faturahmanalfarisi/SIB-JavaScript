<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Aritmatika</title>
</head>
<body>
    <script>
        let a= 10;
        let b= 5;

        //Penjumlahan
        document.write("Hasil Penjumlahan a + b = " + (a + b) + "<br>");

        //Pengurangan
        document.write("Hasil Pengurangan a - b = " + (a - b) + "<br>");

        //Perkalian
        document.write("Hasil Perkalian a * b = " + (a * b) + "<br>");

        //Pembagian
        document.write("Hasil Pembagian a / b = " + (a / b) + "<br>");

        //Modulus (Sisa bagi)
        document.write("Hasil Modulus a % b = " + (a & b) + "<br>");

        //Increment (Penambahan 1)
        a++;
        document.write("Hasil Increment a++ = " + a + "<br>"); // 10 - 1

        //Decrement (Pengurangan 1)  
        b--;
        document.write("Hasil Decrement b-- = " + b + "<br>"); // 5 -1
    </script>
</body>
</html>
