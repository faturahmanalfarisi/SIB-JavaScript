<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Pertemuan 1 - JavaScript</title>
</head>
<body>
    <h1>Tugas JavaScript: Menghitung Luas Bangun Datar</h1>

    <script>
        // SOAL: Menghitung luas dari persegi panjang, bujur sangkar, dan segitiga
        //       menggunakan variabel dan operator.

        // Bagian 1: Menghitung Luas Persegi Panjang
        // Variabel untuk menyimpan nilai panjang dan lebar
        let panjang = 10;
        let lebar = 5;
        // Operator perkalian untuk menghitung luas
        let luasPersegiPanjang = panjang * lebar;
        console.log("Luas Persegi Panjang:");
        console.log("Panjang:", panjang);
        console.log("Lebar:", lebar);
        console.log("Luas:", luasPersegiPanjang);
        console.log("------------------------");

        // Bagian 2: Menghitung Luas Bujur Sangkar (Persegi)
        // Variabel untuk menyimpan nilai sisi
        let sisi = 8;
        // Operator perkalian untuk menghitung luas
        let luasBujurSangkar = sisi * sisi;
        console.log("Luas Bujur Sangkar:");
        console.log("Sisi:", sisi);
        console.log("Luas:", luasBujurSangkar);
        console.log("------------------------");

        // Bagian 3: Menghitung Luas Segitiga
        // Variabel untuk menyimpan nilai alas dan tinggi
        let alas = 12;
        let tinggi = 7;
        // Operator perkalian dan pembagian untuk menghitung luas
        let luasSegitiga = 0.5 * alas * tinggi; // atau (alas * tinggi) / 2
        console.log("Luas Segitiga:");
        console.log("Alas:", alas);
        console.log("Tinggi:", tinggi);
        console.log("Luas:", luasSegitiga);
        console.log("------------------------");
    </script>
</body>
</html>
