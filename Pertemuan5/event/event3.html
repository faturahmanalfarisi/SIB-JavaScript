<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <button id="addChild">Tambah Child</button>
    <div id="parent" style="padding: 20px; background-color: lightgray;">
    <div class="child" style="background-color: lightblue; padding: 10px; margin: 5px;">item 1</div>
    <div class="child" style="background-color: lightblue; padding: 10px; margin: 5px">item 2</div>
    <div class="child" style="background-color: lightblue; padding: 10px; margin: 5px">item 3</div>
</div>

<script>
    document.getElementById("parent").addEventListener("click", function(event){
        if(event.target.matches(".child")){
            alert("elemen child diklik : " + event.target.textContent);
        }
    });
    document.getElementById("addChild").addEventListener("click", function(){
        let newChild = document.createElement("div");
        newChild.className = "child";
        newChild.style.padding = "10px";
        newChild.style.backgroundColor = "lightgreen";
        newChild.textContent = "Item Baru";
        document.getElementById("parent").appendChild(newChild)
    })
</script>
</body>
</html>
