<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Transportasi</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        h1, h2 { color: #333; }
        .container { max-width: 800px; margin: auto; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; }
        .form-group input, .form-group select { width: 100%; padding: 0.5rem; box-sizing: border-box; }
        .button { background-color: #4CAF50; color: white; padding: 0.75rem 1rem; border: none; cursor: pointer; }
        .card { border: 1px solid #ccc; padding: 1rem; margin-bottom: 1rem; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Manajemen Penyewaan Kendaraan</h1>

    <h2>Tambah Pelanggan Baru</h2>
    <div class="form-group">
        <label for="nama">Nama Pelanggan:</label>
        <input type="text" id="nama" required>
    </div>
    <div class="form-group">
        <label for="telepon">Nomor Telepon:</label>
        <input type="tel" id="telepon" required>
    </div>
    <div class="form-group">
        <label for="kendaraan">Kendaraan Disewa:</label>
        <select id="kendaraan" required>
            <option value="Mobil">Mobil</option>
            <option value="Motor">Motor</option>
            <option value="Sepeda">Sepeda</option>
        </select>
    </div>
    <button class="button" onclick="tambahPelanggan()">Tambah Pelanggan</button>

    <hr>

    <h2>Daftar Pelanggan</h2>
    <div id="daftarPelanggan">
        </div>
</div>

<script src="script.js"></script>
</body>
</html>
