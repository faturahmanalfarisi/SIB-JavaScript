<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document object model</title>
</head>
<body>
    <img src="image1.jpg" id="gambar" alt="Gambar 1" width="200">    

    <button onclick="ubahGambar()">Ubah gambar</button>


    <script>
        function ubahGambar(){
            document.getElementById("gambar").setAttribute("src", "image2.jpg");
            document.getElementById("gambar").setAttribute("alt", "Gambar 2");
        }
        
    </script>
</body>
</html>
