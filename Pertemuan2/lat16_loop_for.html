    <script>
        let no;
        for(no=1; no<=10; no++){
            if(no == 20) continue; //Lanjut Looping tetapi skip angkanya
            if(no == 30) break; //Berhenti Looping
            document.write("<br> No. " + no );
        }
    </script>
    <hr><br>
    <hr><br>
    <script>
        let angka;
        for(angka=100; angka>=50; angka--){
            document.write("<br>No. " + angka);
        }
    </script>
