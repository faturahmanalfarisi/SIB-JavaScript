<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ternary</title>
</head>
<body>
    <script>
        //Ternary atau 2 kondisi dalam satu waktu dan untuk menentukan kondisi tersebut tergantung variable kunci
        let siswa = "Budi";
        let nilai = 70;
        let ket = (nilai >= 60) ? "Lulus" : "Tidak Lulus";
        document.write("<br>Siswa Bernama " + siswa + " Dengan Nilai " + nilai + " Dinyatakan : " + ket);

    </script>
</body>
</html>
